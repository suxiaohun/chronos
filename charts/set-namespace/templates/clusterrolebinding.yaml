apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ns_secret_manager_binding
subjects:
  - kind: ServiceAccount
    name:  {{ include "set-namespace.serviceAccountName" . }}
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ns_secret_manager
  apiGroup: rbac.authorization.k8s.io
