apiVersion: v1
kind: Service
metadata:
  labels:
    app: iot-user
  name: iot-user
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
      nodePort: 30123
  selector:
    app: iot-user
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-user
spec:
  selector:
    matchLabels:
      app: iot-user
  replicas: 1
  template:
    metadata:
      labels:
        app: iot-user
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: iot-user
          image: "{{ .Values.image.repository }}/{{ .Values.image.user.name }}:{{ .Values.image.user.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tz-config
              mountPath: /etc/localtime
            - name: config-volume
              mountPath: /.env
              subPath: env
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: config-volume
          configMap:
            name: iot-cfg

