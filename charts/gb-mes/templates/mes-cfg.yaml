  nginx.conf: |
    #user  nobody;
    worker_processes  1;

    #error_log  logs/error.log;
    #error_log  logs/error.log  notice;
    #error_log  logs/error.log  info;

    #pid        logs/nginx.pid;


    events {
        worker_connections  1024;
    }


    http {
        include       mime.types;
        default_type  application/octet-stream;

        #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
        #                  '$status $body_bytes_sent "$http_referer" '
        #                  '"$http_user_agent" "$http_x_forwarded_for"';

        #access_log  logs/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        #keepalive_timeout  0;
        keepalive_timeout  65;

        gzip on;
        #gzip_static on;
        gzip_min_length 1100;
        gzip_buffers 16 8k;
        gzip_http_version 1.0;
        gzip_comp_level 2;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
        gzip_vary off;
        gzip_disable "MSIE [1-6].(?!.*SV1)";
        client_max_body_size 50m;
        #proxy_cache_path /usr/local/cache levels=1:2 keys_zone=mycache:10m max_size=10g inactive=60m use_temp_path=off;
        server {
            listen       8080;
            server_name  127.0.0.1;

            #charset koi8-r;

            #access_log  logs/host.access.log  main;

            location /api/iotDevice/ {
                rewrite ^/api/iotDevice/(.*)$ /api/$1 break;
                proxy_pass http://iot-rest.iot-system:8080;
            }

            location /api/party/ {
                proxy_pass http://mes-check.mes-system:8080;
            }

            location /api/user/ {
                proxy_pass http://mes-user.mes-system:8080;
            }

            location /api/ {
                proxy_pass http://mes-rest.mes-system:8080;
            }

            location / {
                #root   html;
                #index  index.html index.htm;
                 root /usr/share/nginx/html;
                 index index.html;
                 try_files $uri $uri/ /index.html =404;
                 #proxy_cache mycache;
                 #proxy_pass http://127.0.0.1:4200;
            }

            # location ~* \.(gif|jpeg|png|ico|swf)$ {
            #      # d - 天
            #      # h - 小时
            #      # m - 分钟
            #     expires 168h;
            #     add_header Pragma public;
            #     add_header Cache-Control "public, must-revalidate, proxy-revalidate";
            # }

            # redirect server error pages to the static page /50x.html
            #
            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   html;
            }
        }
    }
