apiVersion: v1
kind: Service
metadata:
  labels:
    app: mes-rest
  name: mes-rest
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
      nodePort: 30111
  selector:
    app: mes-rest
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes-rest
spec:
  selector:
    matchLabels:
      app: mes-rest
  replicas: 1
  template:
    metadata:
      labels:
        app: mes-rest
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mes-rest
          image: "{{ .Values.image.repository }}/{{ .Values.image.rest.name }}:{{ .Values.image.rest.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tz-config
              mountPath: /etc/localtime
            - name: config-volume
              mountPath: /.env
              subPath: mes-env
            - name: config-volume
              mountPath: /config/method_target.json
              subPath: method_target.json
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: config-volume
          configMap:
            name: mes-cfg

